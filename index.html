<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- El isotipo SVG de la marca es negro sobre transparente, así que se
         perdería en pestañas con tema oscuro: el favicon se genera del logo,
         que lleva su propio fondo. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Padeleando — Organizá tus torneos de pádel</title>
    <meta name="description" content="Armá torneos de pádel en formato Liga o Americano, cargá los resultados en vivo y compartí la tabla de posiciones con un link. Gratis." />

    <!-- Open Graph: sin SSR estas etiquetas son fijas para todo el sitio. Los
         enlaces a torneos y perfiles necesitan valores por página; eso requiere
         una función en el borde que las inyecte según la ruta. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Padeleando" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Padeleando — Organizá tus torneos de pádel" />
    <meta property="og:description" content="Armá torneos en formato Liga o Americano, cargá los resultados en vivo y compartí la tabla con un link." />
    <meta property="og:image" content="/logo512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Padeleando — Organizá tus torneos de pádel" />
    <meta name="twitter:description" content="Armá torneos en formato Liga o Americano, cargá los resultados en vivo y compartí la tabla con un link." />
    <meta name="twitter:image" content="/logo512.png" />

    <meta name="theme-color" content="#0a0e1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Padeleando" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">

    <script src="https://accounts.google.com/gsi/client" async></script>
